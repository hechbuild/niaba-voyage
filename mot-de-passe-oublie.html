<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#061d49">
  <title>Réinitialiser le mot de passe | Niaba Voyage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260926-2">
</head>
<body>
  <header class="header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">➤</span><span>NIABA <b>VOYAGE</b></span></a></div></header>
  <main class="legal-page">
    <section class="container legal-content" style="max-width:560px">
      <span class="kicker">COMPTE SÉCURISÉ</span>
      <h1>Réinitialiser le mot de passe</h1>
      <p id="recoveryIntro">Indiquez l’adresse e-mail liée à votre compte. Nous vous enverrons un lien sécurisé pour choisir un nouveau mot de passe.</p>
      <form id="recoveryForm">
        <label class="field"><span>Adresse e-mail</span><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="vous@exemple.com"></label>
        <button class="btn primary full-button" type="submit" style="margin-top:16px">Envoyer le lien de réinitialisation</button>
      </form>
      <p id="recoveryStatus" class="form-status" role="status" aria-live="polite"></p>
      <p><a href="/?login=1">Retour à la connexion</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-auth.js?v=20260923-5"></script>
  <script src="/forgot-password.js?v=20260926-1"></script>
</body>
</html>
